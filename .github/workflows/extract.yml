name: Extract Code
on:
  push:
    paths:
      - '*zip'
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract ZIP and Structure Project
        run: |
          unzip "HZ-CHORD-AI-GITHUB-READY-UPDATED (1).zip"
          
          # Delete the .github folder from the unzipped files to bypass the permission error
          rm -rf "HZ-CHORD-AI-GITHUB-READY-UPDATED/.github"
          
          # Move the rest of the project to the root
          cp -a HZ-CHORD-AI-GITHUB-READY-UPDATED/. .
          
          # Clean up
          rm -rf HZ-CHORD-AI-GITHUB-READY-UPDATED
          rm "HZ-CHORD-AI-GITHUB-READY-UPDATED (1).zip"
          
      - name: Commit Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Establish project structure"
          git push
